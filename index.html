<style>
/* Layout: sticky header + tabs; courts drawn as green court cards with a net line; queue beside them on tablets, below on phones */
:root{
  --bg:#eef2ec; --surface:#ffffff; --ink:#15211a; --muted:#5b6b61; --line:#d9e1d6;
  --court:#1e6a4b; --court-deep:#175a3f; --court-line:rgba(255,255,255,.82);
  --chip:#ffffff; --chip-ink:#13201a; --chip-sub:#4f6157;
  --accent:#e3ac12; --accent-soft:#fbefc8; --accent-ink:#4a3600;
  --danger:#b93f2b; --ok:#1e6a4b; --rest:#a86b00;
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Sukhumvit Set","Thonburi",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --ink:#e6ede8; --muted:#94a59b; --line:#28342d;
  --court:#1a5a40; --court-deep:#134631; --court-line:rgba(255,255,255,.7);
  --chip:#eef3ef; --chip-ink:#12201a; --chip-sub:#4a5c52;
  --accent:#f0c23a; --accent-soft:#3a3117; --accent-ink:#f6dc8c;
  --danger:#f07c66; --ok:#63c495; --rest:#e2a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --ink:#e6ede8; --muted:#94a59b; --line:#28342d;
  --court:#1a5a40; --court-deep:#134631; --court-line:rgba(255,255,255,.7);
  --chip:#eef3ef; --chip-ink:#12201a; --chip-sub:#4a5c52;
  --accent:#f0c23a; --accent-soft:#3a3117; --accent-ink:#f6dc8c;
  --danger:#f07c66; --ok:#63c495; --rest:#e2a640; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.iconbtn:disabled{opacity:.4;cursor:default}
.tabs{flex:1;display:flex;gap:4px;padding-block:0 10px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.demo b{font-weight:600}
.demo button{margin-left:auto;border:0;background:var(--accent);color:#2a1f00;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}

/* board */
.board{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:980px){.board{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.courts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.court{background:var(--court);border-radius:16px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cn{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.clock{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:15px;opacity:.85}
.field{position:relative;display:grid;grid-template-columns:1fr 14px 1fr;border:2px solid var(--court-line);border-radius:4px;min-height:150px;background:var(--court-deep)}
.field::before,.field::after{content:"";position:absolute;top:50%;height:0;border-top:1.5px solid var(--court-line);opacity:.45;width:calc(50% - 30px)}
.field::before{left:8px}.field::after{right:8px}
.net{position:relative}
.net::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:0;border-left:3px dashed #fff;transform:translateX(-50%)}
.side{display:flex;flex-direction:column;justify-content:space-around;gap:8px;padding:10px 8px;position:relative;z-index:1}
.pc{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--chip);color:var(--chip-ink);padding:8px 10px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.pn{display:block;font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pm{display:block;font-size:12.5px;color:var(--chip-sub);font-variant-numeric:tabular-nums}
.pm b{color:var(--chip-ink);font-weight:600}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;position:relative;z-index:1}
.empty p{margin:0;opacity:.85;font-size:14px}
.cf{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.end{flex:1;background:#fff;color:var(--court-deep);font-family:var(--font-display);font-size:16px}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn.fill{background:var(--accent);color:#2a1f00;font-family:var(--font-display);font-size:16px;padding:10px 20px}
.btn.fill:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.count{font-family:var(--font-display);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:0 9px;font-size:13px;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:13.5px}
.queue{display:flex;flex-direction:column;gap:14px}
.next{border-color:var(--accent);background:var(--accent-soft)}
.next h2{color:var(--accent-ink)}
.nx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pair{display:flex;flex-direction:column;gap:2px;font-weight:600;color:var(--accent-ink)}
.pair span{overflow-wrap:anywhere}
.vs{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--accent-ink);opacity:.7}
.ql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:8px 10px}
.qi.up{border-color:var(--accent)}
.qn{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.qi.up .qn{color:var(--accent-ink);background:var(--accent);border-radius:6px}
.qname{font-weight:600;overflow-wrap:anywhere}
.qmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qg{font-family:var(--font-display);font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.qg b{display:block;font-size:20px}
.qg small{font-size:11.5px;color:var(--muted)}
.lv{display:inline-block;font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;color:var(--muted)}
.restrow{display:flex;flex-wrap:wrap;gap:6px}
.restrow button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}

/* players */
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
details[open]{display:flex;flex-direction:column;gap:8px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.prow.left{opacity:.55}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.play{background:var(--ok);color:#fff}
.pill.wait{background:var(--bg);color:var(--muted)}
.pill.rest{background:transparent;color:var(--rest);border:1px solid var(--rest)}
.pill.left{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bar{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--court);border-radius:6px}
.bar b{font-family:var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.hist li:first-child{border-top:0}
.hist .hm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,10,.5);border:0;padding:0}
.sheet-card{position:relative;width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet{align-items:center}.sheet-card{border-radius:18px}}
.sheet-card h3{font-family:var(--font-display);font-size:19px;margin:0}
.sheet-card h4{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.opts label:has(input:checked){border-color:var(--ink);background:var(--bg);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.picks{display:flex;flex-direction:column;gap:6px}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2 .btn{flex:1;min-width:130px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600}
.stepper b{font-family:var(--font-display);font-size:24px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;font-weight:600;background:var(--accent);color:#2a1f00;border-radius:5px;padding:1px 6px}
.confirm{border:1px solid var(--danger);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
/* live view / QR */
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}.dot.err{background:var(--danger)}.dot.busy{background:var(--accent)}.dot.off{display:none}
.qrbox{align-self:center;background:#fff;padding:12px;border-radius:12px;line-height:0}
.qrbox>*{max-width:100%;height:auto}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
a.btn{text-align:center;text-decoration:none;color:inherit}
.notice{border:1px solid var(--rest);color:var(--rest);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0}
.err-t{color:var(--danger)}
.mebar{display:flex;flex-direction:column;gap:8px}
.mestat{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0}
.mine{outline:3px solid var(--accent);outline-offset:2px}
div.pc,div.qi{cursor:default}
.pair span.mine{outline:0;background:var(--accent);color:#2a1f00;border-radius:5px;padding:0 6px;width:fit-content}
.pair[style] span.mine{margin-left:auto}
@media (prefers-reduced-motion:no-preference){.court,.qi{transition:transform .15s}.pc:active,.qi:active{transform:scale(.98)}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="22" r="6" fill="var(--accent)"/><path d="M14 18 L27 5 M16 20 L29 9 M12 16 L23 3" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1 id="title">คิวก๊วนแบด</h1><small id="sub"></small></div>
    </div>
    <button class="iconbtn" data-org data-a="qr" aria-label="QR ให้ผู้เล่นดูคิว"><span class="dot off" id="syncdot"></span>QR</button>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const LV=['BG','N','S','P-','P'];
const ST={play:'กำลังเล่น',wait:'รอคิว',rest:'พัก',left:'กลับแล้ว'};
const KEY='kiw-gang-bad-v1';
let S, UNDO=[], tab='court';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===id);
const prio=p=>p.g+p.off;
const active=()=>S.players.filter(p=>p.st==='wait'||p.st==='play');
const minPrio=()=>{const a=active();return a.length?Math.min(...a.map(prio)):0};
const mins=t=>Math.max(0,Math.floor((Date.now()-t)/60000));
const clock=t=>{const s=Math.max(0,Math.floor((Date.now()-t)/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hhmm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});

/* ---------- state ---------- */
function fresh(n=2){return {seq:0,nid:1,courts:Array.from({length:n},(_,i)=>({id:i+1,m:null})),players:[],hist:[],opt:{auto:true},demo:false,day:Date.now()}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.S){S=o.S;UNDO=o.U||[];return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,U:UNDO}))}catch(e){}schedulePush()}
function act(fn){UNDO.push(JSON.stringify(S));if(UNDO.length>30)UNDO.shift();const r=fn();save();render();return r}
function undo(){if(!UNDO.length)return;S=JSON.parse(UNDO.pop());save();render();closeSheet();toast('ย้อนกลับแล้ว')}

/* ---------- queue logic ---------- */
// Order: fewest games (incl. late-join credit) → waited longest → arrived first
function waiting(){return S.players.filter(p=>p.st==='wait').sort((x,y)=>prio(x)-prio(y)||x.ready-y.ready||x.join-y.join)}
const key2=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function meetCounts(){
  const pc={},oc={};
  for(const h of S.hist){
    pc[key2(...h.a)]=(pc[key2(...h.a)]||0)+1; pc[key2(...h.b)]=(pc[key2(...h.b)]||0)+1;
    for(const x of h.a)for(const y of h.b)oc[key2(x,y)]=(oc[key2(x,y)]||0)+1;
  }
  return {pc,oc};
}
function combos(n,k,start=0,cur=[],out=[]){if(cur.length===k){out.push(cur.slice());return out}for(let i=start;i<n;i++){cur.push(i);combos(n,k,i+1,cur,out);cur.pop()}return out}
function bestSplit(four,mc){
  let best=null;
  for(const [a,b] of [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]]){
    const A=a.map(i=>four[i]),B=b.map(i=>four[i]);
    const lvl=Math.abs(A[0].lv+A[1].lv-B[0].lv-B[1].lv)*2;
    const pa=mc.pc[key2(A[0].id,A[1].id)]||0, pb=mc.pc[key2(B[0].id,B[1].id)]||0;
    const part=(pa*pa+pb*pb)*5; // repeat partners get costlier each time
    let opp=0;for(const x of A)for(const y of B)opp+=(mc.oc[key2(x.id,y.id)]||0)*1.5;
    const cost=lvl+part+opp;
    if(!best||cost<best.cost)best={cost,a:A,b:B};
  }
  return best;
}
// Players with fewer games always go first; among players tied at the cut-off,
// allow swapping in someone who waited a bit less if it avoids repeat partners/opponents or a lopsided level split.
function pick(){
  const W=waiting(); if(W.length<4)return null;
  const g4=prio(W[3]);
  const must=W.filter(p=>prio(p)<g4);
  const pool=W.filter(p=>prio(p)===g4).slice(0,Math.max(4-must.length,8-must.length));
  const need=4-must.length, mc=meetCounts();
  let best=null;
  for(const idx of combos(pool.length,need)){
    const skip=idx.reduce((s,i,j)=>s+(i-j),0);
    const sp=bestSplit(must.concat(idx.map(i=>pool[i])),mc);
    const cost=skip*5+sp.cost;
    if(!best||cost<best.cost)best={cost,a:sp.a,b:sp.b};
  }
  return best;
}
function startOn(ci,pk,at=Date.now()){
  S.courts[ci].m={a:pk.a.map(p=>p.id),b:pk.b.map(p=>p.id),t:at,subs:0};
  [...pk.a,...pk.b].forEach(p=>p.st='play');
}
function fillCourt(ci,at){const pk=pick();if(!pk)return false;startOn(ci,pk,at);return true}
function fillAll(at){S.courts.forEach((c,i)=>{if(!c.m)fillCourt(i,at)})}
function endMatch(ci,at=Date.now()){
  const c=S.courts[ci],m=c.m; if(!m)return;
  const seq=++S.seq;
  for(const id of [...m.a,...m.b]){const p=P(id);p.g++;p.st='wait';p.ready=seq;p.since=at}
  S.hist.push({c:c.id,a:m.a,b:m.b,na:m.a.map(id=>P(id).name),nb:m.b.map(id=>P(id).name),t0:m.t,t1:at,subs:m.subs||0});
  c.m=null;
  if(S.opt.auto)fillCourt(ci,at);
}
function cancelMatch(ci){const m=S.courts[ci].m;if(!m)return;[...m.a,...m.b].forEach(id=>P(id).st='wait');S.courts[ci].m=null}
function substitute(ci,outId,inId,outSt,countOut){
  const m=S.courts[ci].m, side=m.a.includes(outId)?m.a:m.b;
  side[side.indexOf(outId)]=inId;
  const o=P(outId); if(countOut)o.g++;
  o.st=outSt; o.ready=++S.seq; o.since=Date.now();
  P(inId).st='play'; m.subs=(m.subs||0)+1;
}
// Late arrivals / people back from a break start level with whoever has played least, so they don't hog consecutive games
function catchUp(p){const base=minPrio();if(prio(p)<base)p.off=base-p.g}
function addPlayer(name,lv){
  name=name.trim(); if(!name)return null;
  const base=minPrio(), seq=++S.seq;
  const p={id:S.nid++,name,lv,g:0,off:base,st:'wait',ready:seq,join:seq,since:Date.now()};
  S.players.push(p); return p;
}
function setStatus(p,st){
  if(st==='wait'&&p.st!=='wait'){catchUp(p);p.ready=++S.seq;p.since=Date.now()}
  p.st=st;
}
function courtOf(id){return S.courts.findIndex(c=>c.m&&(c.m.a.includes(id)||c.m.b.includes(id)))}

  }
  r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+encodeURIComponent(SY.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});

    syncAt=Date.now(); setSync('ok');
  }catch(e){
    setSync('err',e instanceof TypeError?'ส่งข้อมูลไม่ได้ (เน็ตหลุด หรือเปิดหน้านี้จาก claude.ai ซึ่งต่อเว็บอื่นไม่ได้) จะลองใหม่อัตโนมัติ':e.message);
  }
  pushing=false; if(pushAgain){pushAgain=false;push()}
}
async function removeView(t){if(!t||!SY.db)return;try{const tok=await idToken();await fetch(`${SY.db}/views/${t}.json?auth=${encodeURIComponent(tok)}`,{method:'DELETE'})}catch(e){}}
function syncText(){return syncState==='ok'?`ส่งข้อมูลล่าสุด ${hhmm(syncAt)} · ผู้เล่นเห็นคิวทันทีที่กด`:syncState==='err'?syncErr:syncState==='busy'?'กำลังส่งข้อมูล…':''}
function setSync(st,msg=''){
  syncState=st; syncErr=msg;
  const d=$('#syncdot'); if(d)d.className='dot '+st;
  const m=$('#syncmsg'); if(m&&SY.on){m.className='hint'+(st==='err'?' err-t':'');m.textContent=syncText()}
}
function qrHTML(){
  const head=`<h3>ให้ผู้เล่นสแกนดูคิวตัวเอง</h3>`;
  const local=location.protocol==='file:'?`<p class="notice">ตอนนี้เปิดจากไฟล์ในเครื่อง ต้องฝากไฟล์นี้บนเว็บ (เช่น GitHub Pages) ก่อน ผู้เล่นถึงจะเปิดลิงก์ได้</p>`:'';
  if(!SY.on)return head+`<p class="hint">เชื่อม Firebase (ฟรี) ครั้งเดียวต่อเครื่อง ดูขั้นตอนในไฟล์ SETUP-QR.md</p>${local}
    <label class="fl">Database URL<input type="text" id="fdb" placeholder="https://xxx-default-rtdb.asia-southeast1.firebasedatabase.app" value="${esc(SY.db||'')}" autocomplete="off"></label>
    <label class="fl">Web API Key<input type="text" id="fkey" placeholder="AIza…" value="${esc(SY.key||'')}" autocomplete="off"></label>
    <p class="hint" id="syncmsg"></p>
    <button class="btn pri" data-a="syncConnect">เชื่อมต่อและสร้าง QR</button>`;
  return head+`<p class="hint">สแกนแล้วเปิดหน้า "ดูคิว" อย่างเดียว ไม่เห็นเมนูจัดการใดๆ ใช้ QR เดิมได้ทุกครั้งที่มาเล่น</p>${local}
    <div class="qrbox" id="qrbox"></div>
    <input type="text" readonly id="vlink" value="${esc(viewURL())}" aria-label="ลิงก์หน้าดูคิว">
    <p class="hint${syncState==='err'?' err-t':''}" id="syncmsg">${esc(syncText())}</p>
    <div class="row2"><button class="btn pri" data-a="copyLink">คัดลอกลิงก์</button><a class="btn sec" href="${esc(viewURL())}" target="_blank" rel="noopener">เปิดหน้าดูคิว</a></div>
    <details><summary>ตัวเลือกเพิ่มเติม</summary><div class="row2"><button class="btn sec" data-a="syncNewQR">สร้าง QR ใหม่ (QR เก่าจะใช้ไม่ได้)</button><button class="btn sec" data-a="syncOff">หยุดแชร์คิว</button></div></details>`;
}
function drawQR(){
  const b=$('#qrbox'); if(!b)return; b.innerHTML='';
  if(window.QRCode)new QRCode(b,{text:viewURL(),width:240,height:240,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  else b.outerHTML='<p class="notice">โหลดตัวสร้าง QR ไม่ได้ (ไม่มีเน็ต?) ส่งลิงก์ด้านล่างให้ผู้เล่นแทนได้</p>';
}

/* ---------- player view (read-only, opened from the QR link) ---------- */
let V,VIEWER=false,ME='',meNames='';
try{ME=localStorage.getItem('kiw-me')||''}catch(e){}
function viewer(token,dbHost){
  VIEWER=true;
  document.querySelectorAll('[data-org]').forEach(e=>e.hidden=true);
  const base='https://'+dbHost;
  if(!dbOk(base)||!/^[a-z0-9]{6,40}$/.test(token)){$('#app').innerHTML='<section class="panel"><h2>ลิงก์ไม่ถูกต้อง</h2><p class="hint">สแกน QR จากผู้จัดก๊วนอีกครั้ง</p></section>';return}
  const url=`${base}/views/${token}.json`;
  $('#app').innerHTML='<section class="panel"><h2>กำลังโหลดคิว…</h2></section>';
  const refetch=()=>fetch(url).then(r=>r.json()).then(d=>{V=d;vrender()}).catch(()=>{});
  const es=new EventSource(url);
  es.addEventListener('put',e=>{try{const m=JSON.parse(e.data);if(m.path==='/'){V=m.data;vrender()}else refetch()}catch(err){}});
  es.addEventListener('patch',refetch);
  es.onerror=()=>{const s=$('#sub');if(s)s.textContent='การเชื่อมต่อหลุด กำลังต่อใหม่…'};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refetch()});
}
function vchip(p){return `<div class="pc${p.n===ME?' mine':''}"><span class="pn">${esc(p.n)}</span><span class="pm">เกมที่ <b>${(+p.g||0)+1}</b> ของเขา · ${LV[+p.l]||''}</span></div>`}
function vtick(){const s=$('#sub');if(VIEWER&&s&&V)s.textContent=`ดูคิว · อัปเดต ${hhmm(V.at)} · จบไปแล้ว ${+V.games||0} เกม`}
function vrender(){
  if(!V){$('#app').innerHTML='<section class="panel"><h2>ยังไม่มีคิวให้ดู</h2><p class="hint">ผู้จัดก๊วนยังไม่ได้เริ่ม หรือหยุดแชร์คิวแล้ว</p></section>';return}
  const courts=V.courts||[], queue=V.queue||[], rest=V.rest||[], nx=V.next;
  $('#title').textContent=V.club||'คิวก๊วนแบด'; document.title=(V.club||'คิวก๊วนแบด')+' · ดูคิว'; vtick();
  const all=[...courts.flatMap(c=>[...(c.a||[]),...(c.b||[])]),...queue,...rest].map(p=>p.n).sort((a,b)=>a.localeCompare(b,'th'));
  // status line for the player who picked their own name
  let stat='เลือกชื่อของคุณ เพื่อดูว่าอีกนานแค่ไหนจะได้ลง';
  if(ME){
    const ci=courts.find(c=>[...(c.a||[]),...(c.b||[])].some(p=>p.n===ME));
    const qi=queue.findIndex(p=>p.n===ME), r=rest.find(p=>p.n===ME);
    const inNext=nx&&[...(nx.a||[]),...(nx.b||[])].includes(ME);
    if(ci){const p=[...(ci.a||[]),...(ci.b||[])].find(p=>p.n===ME);stat=`กำลังเล่นที่สนาม ${ci.id} · เกมที่ ${(+p.g||0)+1} ของคุณ`}
    else if(inNext)stat='เตรียมตัว! คุณอยู่ชุดถัดไป';
    else if(qi>=0)stat=`คุณอยู่คิวที่ ${qi+1} · เล่นไปแล้ว ${+queue[qi].g||0} เกม`;
    else if(r)stat=`คุณพักอยู่ · เล่นไปแล้ว ${+r.g||0} เกม`;
    else stat='ไม่พบชื่อนี้ในคิววันนี้';
  }
  const key=all.join('|');
  let mebar=$('#mebar');
  if(!mebar||key!==meNames){
    meNames=key;
    $('#app').innerHTML=`<section class="panel next mebar" id="mebar"><p class="mestat" id="mestat"></p><select id="mesel" aria-label="ชื่อของคุณ"><option value="">— เลือกชื่อของคุณ —</option>${all.map(n=>`<option ${n===ME?'selected':''}>${esc(n)}</option>`).join('')}</select></section><div id="vbody"></div>`;
  }
  $('#mestat').textContent=stat;
  $('#vbody').innerHTML=`<div class="board"><section class="courts">${courts.map(c=>(c.a||[]).length?`<article class="court"><div class="ch"><span class="cn">สนาม ${+c.id}</span><span class="clock" data-since="${+c.t}">${clock(+c.t)}</span></div><div class="field"><div class="side">${(c.a||[]).map(vchip).join('')}</div><div class="net" aria-hidden="true"></div><div class="side">${(c.b||[]).map(vchip).join('')}</div></div></article>`
      :`<article class="court"><div class="ch"><span class="cn">สนาม ${+c.id}</span><span class="clock">ว่าง</span></div><div class="field"><div class="empty"><p>รอผู้จัดส่งคนลงสนาม</p></div></div></article>`).join('')}</section>
    <aside class="queue">
      <section class="panel next"><h2>ชุดถัดไป</h2>${nx?`<div class="nx"><div class="pair">${(nx.a||[]).map(n=>`<span${n===ME?' class="mine"':''}>${esc(n)}</span>`).join('')}</div><span class="vs">VS</span><div class="pair" style="text-align:right">${(nx.b||[]).map(n=>`<span${n===ME?' class="mine"':''}>${esc(n)}</span>`).join('')}</div></div>`:'<p class="hint">รอคนในคิวให้ครบ 4 คน</p>'}</section>
      <section class="panel"><h2>รอคิว <span class="count">${queue.length}</span></h2>${queue.length?`<ol class="ql">${queue.map((p,i)=>`<li><div class="qi${p.n===ME?' mine':''}"><span class="qn">${i+1}</span><span><span class="qname">${esc(p.n)}</span><span class="lv">${LV[+p.l]||''}</span><br><span class="qmeta" data-wait="${+p.s}">รอ ${mins(+p.s)} นาที</span></span><span class="qg"><b>${+p.g||0}</b><small>เกม</small></span></div></li>`).join('')}</ol>`:'<p class="hint">ทุกคนอยู่ในสนาม</p>'}</section>
      ${rest.length?`<section class="panel"><h2>พักอยู่ <span class="count">${rest.length}</span></h2><p class="hint">${rest.map(p=>esc(p.n)+' · '+(+p.g||0)).join(', ')}</p></section>`:''}
      <p class="hint">หน้านี้ดูได้อย่างเดียว และอัปเดตเองทุกครั้งที่ผู้จัดกด</p>
    </aside></div>`;
}

/* ---------- actions ---------- */
const H={
  tab:x=>{tab=x;render();scrollTo(0,0)},
  undo, settings:()=>openSheet(settingsHTML()), close:closeSheet,
  fill:x=>{act(()=>fillCourt(+x))},
  // Ending or cancelling a game always goes through a confirm sheet, so a stray tap does nothing;
  // the confirm button carries that game's start time, so a double tap can't also end the next game
  end:x=>{if(S.courts[+x]?.m)openSheet(confirmGameHTML(+x,'end'))},
  cancel:x=>{if(S.courts[+x]?.m)openSheet(confirmGameHTML(+x,'cancel'))},
  endok:x=>{const [ci,t]=x.split(':').map(Number),c=S.courts[ci];closeSheet();if(c?.m?.t!==t)return;act(()=>endMatch(ci));toast(`จบเกมสนาม ${c.id}`+(c.m?' · ชุดถัดไปลงแล้ว':''))},
  cancelok:x=>{const [ci,t]=x.split(':').map(Number),c=S.courts[ci];closeSheet();if(c?.m?.t!==t)return;act(()=>cancelMatch(ci));toast('ยกเลิกเกมแล้ว ทั้ง 4 คนกลับไปรอคิว')},
  tapcourt:x=>{const [ci,id]=x.split(':').map(Number);openSheet(subHTML(ci,id))},
  subout:x=>{const [ci,id]=x.split(':').map(Number);openSheet(subHTML(ci,id))},
  subin:x=>{const [ci,o,i]=x.split(':').map(Number);const st=$('input[name=outst]:checked').value,cnt=$('#subcount').checked;closeSheet();act(()=>substitute(ci,o,i,st,cnt));toast(`${P(i).name} ลงแทน ${P(o).name}`)},
  tapp:x=>{const id=+x,p=P(id);if(p.st==='play'){const ci=courtOf(id);openSheet(subHTML(ci,id))}else openSheet(playerHTML(id))},
  setst:x=>{const [id,st]=x.split(':');closeSheet();act(()=>setStatus(P(+id),st));toast(`${P(+id).name}: ${ST[st]}`)},
  gm:x=>{const [id,d]=x.split(':').map(Number);act(()=>{const p=P(id);p.g=Math.max(0,p.g+d)});openSheet(playerHTML(id))},
  saveP:x=>{const n=$('#ename').value.trim(),lv=+$('#elv').value;if(!n)return;act(()=>{const p=P(+x);p.name=n;p.lv=lv});closeSheet()},
  delP:x=>{closeSheet();act(()=>{S.players=S.players.filter(p=>p.id!==+x)})},
  courts:x=>{
    const d=+x;
    if(d>0){if(S.courts.length>=12)return;act(()=>{S.courts.push({id:Math.max(0,...S.courts.map(c=>c.id))+1,m:null});if(S.opt.auto)fillCourt(S.courts.length-1)})}
    else{const last=S.courts[S.courts.length-1];if(S.courts.length<=1)return;if(last.m)return toast(`จบเกมในสนาม ${last.id} ก่อนลดสนาม`);act(()=>S.courts.pop())}
    openSheet(settingsHTML());
  },
  newday:x=>{const el=$('#confirm');el.hidden=false;el.innerHTML=`<b>${x==='keep'?'ล้างจำนวนเกมและประวัติ แต่เก็บรายชื่อไว้?':'ล้างรายชื่อ เกม และประวัติทั้งหมด?'}</b><span class="hint">กดย้อนกลับได้ถ้าเปลี่ยนใจ</span><button class="btn warn" data-a="newdayok" data-x="${x}">ยืนยัน</button>`},
  newdayok:x=>{closeSheet();act(()=>{
    if(x==='all'){const n=S.courts.length,club=S.opt.club;S=fresh(n);S.opt.club=club;return}
    S.courts.forEach(c=>c.m=null);S.hist=[];S.demo=false;S.day=Date.now();
    S.players.forEach(p=>{p.g=0;p.off=0;p.st='wait';p.since=Date.now()});
  });toast('เริ่มวันใหม่แล้ว')},
  cleardemo:()=>{act(()=>{const club=S.opt.club;S=fresh(S.courts.length);S.opt.club=club});tab='players';render()},
  qr:()=>{openSheet(qrHTML());drawQR()},
  syncConnect:async()=>{
    const db=normDb($('#fdb').value),key=$('#fkey').value.trim(),msg=$('#syncmsg');
    if(!dbOk(db)){msg.className='hint err-t';msg.textContent='Database URL ต้องลงท้ายด้วย firebasedatabase.app หรือ firebaseio.com';return}
    if(!key){msg.className='hint err-t';msg.textContent='ใส่ Web API Key ด้วย';return}
    if(key!==SY.key){delete SY.id;delete SY.refresh}
    Object.assign(SY,{db,key,on:true,token:SY.token||newToken()});saveSync();
    msg.className='hint';msg.textContent='กำลังเชื่อมต่อ…';
    await push();
    if(syncState==='err'){SY.on=false;saveSync();msg.className='hint err-t';msg.textContent=syncErr;return}
    H.qr();toast('เชื่อมต่อแล้ว ผู้เล่นสแกน QR ได้เลย');
  },
  copyLink:()=>{const u=viewURL();try{navigator.clipboard.writeText(u).then(()=>toast('คัดลอกลิงก์แล้ว'),()=>$('#vlink').select())}catch(e){$('#vlink').select()}},
  syncNewQR:async()=>{const old=SY.token;await removeView(old);SY.token=newToken();saveSync();await push();H.qr();toast('สร้าง QR ใหม่แล้ว')},
  syncOff:async()=>{await removeView(SY.token);SY.on=false;saveSync();setSync('off');H.qr();toast('หยุดแชร์คิวแล้ว')},
  bulk:()=>{const names=$('#pbulk').value.split(/\n|,/).map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);if(!names.length)return;act(()=>{names.forEach(n=>addPlayer(n,2));if(S.opt.auto)fillAll()});toast(`เพิ่ม ${names.length} คน`)},
  copy:()=>{
    const d=new Date(S.day).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
    const rows=S.players.filter(p=>p.g>0).sort((a,b)=>b.g-a.g).map(p=>`${p.name} ${p.g} เกม`);
    const text=`สรุปก๊วนแบด ${d}\n${S.hist.length} เกม · ${S.courts.length} สนาม\n\n${rows.join('\n')}`;
    const fallback=()=>{openSheet(`<h3>คัดลอกข้อความนี้</h3><textarea id="copytext" rows="10" readonly>${esc(text)}</textarea>`);const t=$('#copytext');t.focus();t.select()};
    try{navigator.clipboard.writeText(text).then(()=>toast('คัดลอกแล้ว'),fallback)}catch(e){fallback()}
  }
};
document.addEventListener('click',e=>{
  wake();
  const el=e.target.closest('[data-a]'); if(!el||el.disabled)return;
  H[el.dataset.a]?.(el.dataset.x,el);
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addf')return; e.preventDefault();
  const n=$('#pname').value,lv=+$('#plv').value; if(!n.trim())return;
  const p=act(()=>{const p=addPlayer(n,lv);if(S.opt.auto)fillAll();return p});
  toast(`เพิ่ม ${p.name}`+(p.off?` · เริ่มนับที่ ${p.off} เกม`:''));
  $('#plv').value=lv; $('#pname').focus();
});
document.addEventListener('change',e=>{
  if(e.target.id==='optauto')act(()=>{S.opt.auto=e.target.checked});
  if(e.target.id==='optclub')act(()=>{S.opt.club=e.target.value.trim()});
  if(e.target.id==='mesel'){try{localStorage.setItem('kiw-me',e.target.value)}catch(err){}ME=e.target.value;vrender()}
});

let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}
let lock=null;function wake(){if(VIEWER||lock||!navigator.wakeLock)return;navigator.wakeLock.request('screen').then(l=>{lock=l;l.addEventListener('release',()=>lock=null)}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
setInterval(()=>{
  document.querySelectorAll('[data-since]').forEach(el=>el.textContent=clock(+el.dataset.since));
  document.querySelectorAll('[data-wait]').forEach(el=>el.textContent=`รอ ${mins(+el.dataset.wait)} นาที`);
},1000);
setInterval(()=>{if(SY.on&&syncState==='err')push()},15000);

const QS=new URLSearchParams(location.search);
if(QS.get('v'))viewer(QS.get('v'),QS.get('db')||'');
else{if(!load())demo();render();if(SY.on)schedulePush()}
</script>
